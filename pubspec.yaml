name: pagenest
description: "PageNest（拾页）Android 与 iOS 共用的 Flutter 阅读应用。"
publish_to: 'none'
version: 1.0.1+12

environment:
  sdk: '>=3.11.3 <4.0.0'

dependencies:
  archive: ^4.0.9
  cross_file: ^0.3.5+2
  crypto: ^3.0.7
  dio: ^5.10.0
  enough_convert: ^1.6.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  # P1-01 使用 OpenCC 的 Android/iOS 原生实现完成完整简繁转换，避免维护不完整字符表。
  flutter_open_chinese_convert: ^0.9.0
  # App 登录 Token 仅保存在 Android Keystore / iOS Keychain，绝不写入数据库或普通偏好。
  flutter_secure_storage: ^10.0.0
  html: ^0.15.6
  json_path: ^0.9.0
  jsf: ^1.1.0
  mobile_scanner: ^7.2.0
  # 小型高频非关系偏好使用官方 MMKV；业务层只依赖项目内类型化 Store。
  mmkv: ^2.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.9.2
  share_plus: ^12.0.1
  # Flutter 3.41.5 当前内置 Dart 3.11.3，固定到仍兼容该 SDK 的版本。
  sqflite: 2.4.2
  # 仅用于服务端下发 Android 升级地址的系统浏览器跳转；不下载或安装 APK。
  url_launcher: ^6.3.2
  # M10 使用 Flutter 官方 WKWebView/Android WebView 适配，统一登录、页面脚本和 Cookie 同步。
  webview_flutter: ^4.14.1
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # iOS 插件继续统一由 CocoaPods 管理，避免新 Flutter SDK 自动切换 Swift Package Manager 后
  # 与现有 Podfile.lock、Runner.xcworkspace 和 Xcode 直接运行流程产生两套依赖接线。
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/default_data/adult_keywords.txt
    - assets/default_data/adult_domains.txt
